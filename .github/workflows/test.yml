name: test

on: [push, pull_request, workflow_dispatch]

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: libesbuild/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
          bb: latest
      - name: Build the shim
        shell: bash
        run: libesbuild/build.sh
      - name: Test on babashka
        run: bb test
      - name: Test on the JVM
        run: clojure -M:test
