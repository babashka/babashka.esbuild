name: natives

on:
  push:
    branches: [main]
    tags: ["libesbuild-*"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14        # arm64
          - os: macos-13        # x86_64
          - os: ubuntu-latest   # x86_64
          - os: ubuntu-24.04-arm
          - os: windows-latest
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: libesbuild/go.sum
      - name: Build the shim
        shell: bash
        run: libesbuild/build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: natives-${{ matrix.os }}
          path: libesbuild/resources/
          retention-days: 5

  jar:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@13.0
        with:
          cli: latest
      - uses: actions/download-artifact@v4
        with:
          path: libesbuild/resources/
          merge-multiple: true
      - name: List what the jar will carry
        run: find libesbuild/resources -type f | sort
      - name: Build the jar
        run: cd libesbuild && clojure -T:build jar
      - uses: actions/upload-artifact@v4
        with:
          name: libesbuild-jar
          path: libesbuild/target/*.jar
      - name: Deploy to Clojars
        if: startsWith(github.ref, 'refs/tags/libesbuild-')
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: cd libesbuild && clojure -T:build deploy
