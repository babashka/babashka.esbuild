name: natives

on:
  push:
    branches: [main]
    tags: ["libesbuild-*"]
  pull_request:
  workflow_dispatch:

env:
  ZIG_VERSION: "0.16.0"

jobs:
  # zig cross compiles the linux and windows shims, and Xcode covers both mac
  # architectures, so one macOS runner builds the whole jar.
  jar:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: libesbuild/go.sum
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
      - uses: DeLaGuardo/setup-clojure@3.7.0
        with:
          cli: latest
          bb: latest
      - name: Cache zig
        id: zig
        uses: actions/cache@v4
        with:
          path: ~/zig
          key: zig-${{ env.ZIG_VERSION }}-macos-aarch64
      - name: Install zig
        if: steps.zig.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/zig
          curl -sL https://ziglang.org/download/$ZIG_VERSION/zig-aarch64-macos-$ZIG_VERSION.tar.xz \
            | tar -xJ -C ~/zig --strip-components=1
      - run: echo "$HOME/zig" >> $GITHUB_PATH
      - name: Build every shim
        run: bb natives --all
      - name: List what the jar will carry
        run: find libesbuild/resources -type f | sort
      - name: Build the jar
        run: cd libesbuild && clojure -T:build jar
      - uses: actions/upload-artifact@v4
        with:
          name: libesbuild-jar
          path: libesbuild/target/*.jar
      - name: Deploy to Clojars
        if: startsWith(github.ref, 'refs/tags/libesbuild-')
        env:
          CLOJARS_USERNAME: ${{ secrets.CLOJARS_USERNAME }}
          CLOJARS_PASSWORD: ${{ secrets.CLOJARS_PASSWORD }}
        run: cd libesbuild && clojure -T:build deploy
